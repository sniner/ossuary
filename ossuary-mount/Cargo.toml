[package]
name = "ossuary-mount"
description = "The record mounted as a read-only filesystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ossuary-mount"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env"] }
ossuary-core = { path = "../ossuary-core", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

# The macOS door: an NFS server the system's own client mounts.
[target.'cfg(target_os = "macos")'.dependencies]
async-trait = "0.1.89"
nfsserve = "0.11.0"

# The Linux door: a FUSE filesystem mounted through fusermount3, no root.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"
