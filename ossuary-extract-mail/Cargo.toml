[package]
name = "ossuary-extract-mail"
description = "Mail extractor for ossuary archives: message headers, message text, attachments and nested messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ossuary-extract-mail"
path = "src/main.rs"

[dependencies]
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
