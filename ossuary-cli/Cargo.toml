[package]
name = "ossuary-cli"
description = "The command line onto an ossuary archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ossuary"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env"] }
gethostname = "1.0.2"
ossuary-core = { path = "../ossuary-core", version = "0.2.0" }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
